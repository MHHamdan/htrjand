[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htrjand"
version = "1.0.0"
description = "HTR-JAND: line-level handwritten text recognition with a joint attention network and knowledge distillation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Hamdan" }, { name = "Abderrahmane Rahiche" }, { name = "Mohamed Cheriet" }]
requires-python = ">=3.9"
keywords = ["handwritten text recognition", "HTR", "OCR", "CTC", "knowledge distillation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# pure inference: load a released model from the Hub or a directory, preprocess, greedy / LM decoding
dependencies = [
    "torch>=2.1",
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    "Pillow>=9",
]

[project.optional-dependencies]
t5 = ["transformers>=4.40"]
demo = ["gradio>=4.0", "transformers>=4.40"]
train = ["h5py>=3.8", "editdistance>=0.6", "pyyaml>=6", "matplotlib>=3.7"]
dev = ["pytest>=7", "h5py>=3.8", "editdistance>=0.6", "pyyaml>=6", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/DocumentRecognitionModels/htrjand"

[project.scripts]
htrjand-predict = "htrjand.cli:main"

[tool.setuptools]
packages = ["htrjand"]

[tool.setuptools.package-data]
htrjand = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
