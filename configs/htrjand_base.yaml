# HTR-JAND base configuration (68 x 864)
#
# ONE configuration: the recipe behind the base-configuration rows of the results (the `combined_final_*`
# runs): five corpora in one archive, 68 x 864 canvas, no synthetic lines, no per-corpus fine-tuning,
# greedy CTC decoding. Exact commands: configs/queues/runs_queue_N1.txt (Teacher and distilled Student,
# seed 1), runs_queue_N3.txt (Teacher, seed 2), runs_queue_N4.txt (Student, seed 2);
# tests/test_config.py checks the `base_configuration` values against those commands.
#
# `package_defaults` records what `python -m htrjand.train` does WITHOUT flags (tests/test_config.py asserts
# the code and this section agree). They are the starting point of the IAM development runs (initial recipe:
# queues A, A2, B; tuned recipe: queues C to I; index in configs/queues/README.md); they are not the base
# configuration. The 128 x 1632 configuration of the released models is in configs/queues/ (P5/P6, S1-S4,
# FT, FTT) and docs/FINAL_REPORT_T5.md.
#
# Every leaf is {value, provenance, reason}. Provenance tags:
#   PAPER (the HTR-JAND method description) | FIGURE (the architecture figure) | HISTORICAL (earlier code or
#   archive of this project) | REPOSITORY_PRIOR (an earlier reimplementation in this project) |
#   RECONSTRUCTED_WITH_EVIDENCE | RECONSTRUCTED_WITH_ASSUMPTION | ASSUMPTION |
#   ASSUMPTION_SELECTED_ON_VALIDATION | PAPER_AMBIGUITY
# Register IDs (A-xx, D-xxx) are internal design-register / decision-log identifiers (docs/DECISION_LOG.md).

label: {value: HTRJAND_RUN, provenance: RECONSTRUCTED_WITH_EVIDENCE, reason: "result class written by train.py / evaluate.py"}

base_configuration:
  runs: {value: [combined_final_teacher_s1, combined_final_teacher_s2, combined_final_student_kd_s1, combined_final_student_kd_s2], provenance: ASSUMPTION, reason: "configs/queues/runs_queue_N1.txt, N3, N4"}
  data:
    corpora: {value: "five-corpus archive: IAM, RIMES, Bentham, Saint Gall (labels as distributed), Washington", provenance: PAPER, reason: "one archive, `--dataset combined` (cleaned_combined.hdf5), the concatenation of the five official-partition archives"}
    canvas: {value: [68, 864], provenance: PAPER, reason: "fixed base canvas"}
    resize: {value: "aspect-preserving scale min(864/w, 68/h), INTER_AREA, centre pad, invert if light", provenance: HISTORICAL, reason: "htrjand/prepare_data.py, pixel-exact with the earlier archive builder (A-05)"}
    normalisation: {value: paper, provenance: PAPER, reason: "per-image min-max to [-1, 1]; 'unit' (/255) is available"}
    partitions: {value: official, provenance: PAPER, reason: "IAM = FKI large writer-independent task (train / validationset1 + validationset2 / test); RIMES ICDAR 2011 lines, validation = the last 10 % of the official training lines (1,134); Bentham R0; Saint Gall; Washington cv1 (docs/DATA_SPLITS.md)"}
    charset: {value: "union of the five training splits, 108 characters, V = 111", provenance: RECONSTRUCTED_WITH_ASSUMPTION, reason: "train-only charset, so no validation or test character enters the output layer (A-02)"}
    augmentation: {value: strong, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "affine + photometric jitter plus projective, elastic, height-relative blots and stroke-width jitter (D-005)"}
    synthetic_data: {value: none, provenance: ASSUMPTION, reason: "the base configuration uses no synthetic lines; the 128 x 1632 models mix them in (queues P5, S1, S2)"}
  model:
    teacher: {value: "preset paper_teacher: 5 gated+SE blocks [32, 64, 128, 256, 512], pools (2,2)x3 + (2,1)x2, SE r 16, 4 BiLSTM x 128 per direction, Combined Attention (2 heads) after the LSTMs, fusion paper, auxiliary CTC head", provenance: PAPER, reason: "D-001 for the width reading"}
    student: {value: "preset paper_student: 3 gated+SE blocks [16, 32, 64], pools (2,2)x3, SE r 8, 4 BiLSTM x 64 per direction, Combined Attention (1 head), auxiliary CTC head", provenance: PAPER, reason: "at 128 x 1632 the released Student uses pools (2,2), (2,2), (4,2) (preset htrjand_student)"}
    parameter_counts: {value: "Teacher 6,172,335 / Student 806,287 deployed at 68 x 864, V = 111 (totals 6,286,110 / 863,230 with the auxiliary head)", provenance: RECONSTRUCTED_WITH_EVIDENCE, reason: "measured by instantiating the checkpoints (results/control_compute.json)"}
  training:
    optimizer: {value: AdamW, provenance: HISTORICAL, reason: "earlier code of this project"}
    schedule: {value: "cosine, lr 1e-3, 5 warm-up epochs, 120 epochs, no early stopping", provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "IAM screen: validation CER 5.29 vs 6.64 with the plateau rule (D-005)"}
    batch_size: {value: 16, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "D-005"}
    dropout: {value: "0.2 output/attention, 0.1 CNN, 0.2 recurrent", provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "D-002 and D-005"}
    weight_decay: {value: 5.0e-4, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "D-005"}
    ema: {value: 0.999, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "weight average of the same run (D-005)"}
    gradient_clip: {value: 1.0, provenance: HISTORICAL, reason: "earlier code of this project"}
    aux_weight_delta: {value: 0.1, provenance: PAPER, reason: "constant weight of the auxiliary CTC loss"}
    checkpoint_selection: {value: "lowest validation CER (EMA or raw weights)", provenance: ASSUMPTION, reason: "validation only; the test split is decoded once"}
  distillation:
    teacher: {value: "frozen combined_final_teacher of the same seed", provenance: PAPER, reason: "queues N1 / N4"}
    loss: {value: "alpha L_ctc + gamma tau^2 KL(P_T || P_S) + delta L_aux", provenance: PAPER, reason: "frame-wise cross-entropy omitted: beta = 0 under these weights and it needs an alignment (A-20)"}
    alpha: {value: [0.7, 0.4], provenance: PAPER, reason: "linear in the epoch fraction"}
    gamma: {value: [0.2, 0.5], provenance: PAPER, reason: "linear in the epoch fraction"}
    tau: {value: 2.0, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "{1, 2, 4} declared, 2 chosen on IAM validation CER (D-004)"}
  evaluation:
    decoder: {value: greedy, provenance: ASSUMPTION, reason: "best-path CTC; the LM and T5 decoders are reported separately"}
    metrics: {value: "corpus-level CER, WER (whitespace tokens), SER; no normalisation", provenance: RECONSTRUCTED_WITH_EVIDENCE, reason: "htrjand/metrics.py"}
    test_split_policy: {value: "decoded once per checkpoint; all selection on validation", provenance: ASSUMPTION, reason: "integrity rule of this release"}

package_defaults:   # `python -m htrjand.train` without flags; the initial IAM development recipe (queues A, A2, B)
  data:
    augmentation: {value: base, provenance: REPOSITORY_PRIOR, reason: "rotation ±1.5°, scale [0.95, 1], shear ±0.1, then brightness / contrast / blur / noise with p = 0.5 each (PRE-03)"}
    normalisation: {value: paper, provenance: PAPER, reason: "per-image min-max to [-1, 1]"}
  model:
    teacher:
      cnn_blocks: {value: 5, provenance: PAPER, reason: "Teacher CNN depth"}
      channels: {value: [32, 64, 128, 256, 512], provenance: FIGURE, reason: "shape labels of the architecture figure (A-09)"}
      conv: {value: gated, provenance: PAPER, reason: "FullGatedConv2d; preset historical_teacher keeps plain convolutions"}
      block_order: {value: "conv -> BN -> ReLU -> MaxPool -> SE", provenance: PAPER, reason: "CNN block"}
      pools: {value: [[2, 2], [2, 2], [2, 2], [2, 1], [2, 1]], provenance: HISTORICAL, reason: "gives 108 frames and 2 feature rows at 68 x 864 (A-12)"}
      se_reduction: {value: 16, provenance: HISTORICAL, reason: "A-11"}
      lstm_layers: {value: 4, provenance: PAPER, reason: "four bidirectional LSTM layers"}
      lstm_hidden_per_direction: {value: 128, provenance: RECONSTRUCTED_WITH_EVIDENCE, reason: "'128' read as nn.LSTM hidden size (256-d attention); preset paper_teacher_d128 keeps 64 per direction (D-001)"}
      heads: {value: 2, provenance: PAPER, reason: "two heads in the Teacher, one in the Student"}
      proxima: {value: learned-query global attention, provenance: HISTORICAL, reason: "a single learned query per head broadcast over time (A-16)"}
      fusion: {value: paper, provenance: PAPER, reason: "LN(W_f[O_MHA; O_Prox] + X); 'historical' adds a post-norm residual per branch"}
      attention_position: {value: after_lstm, provenance: PAPER, reason: "CNN -> BiLSTM -> attention; 'before_lstm' available (A-36)"}
      aux_head: {value: "dense CTC head on the CNN columns, weight 0.1", provenance: RECONSTRUCTED_WITH_ASSUMPTION, reason: "alignment-free reading of the auxiliary loss (A-17)"}
      dropout: {value: 0.01, provenance: HISTORICAL, reason: "earlier code of this project"}
    student:
      cnn_blocks: {value: 3, provenance: PAPER, reason: "Student CNN depth"}
      channels: {value: [16, 32, 64], provenance: PAPER, reason: "starting at 16 channels (A-09)"}
      pools: {value: [[2, 2], [2, 2], [2, 2]], provenance: HISTORICAL, reason: "keeps T = 108 at 68 x 864 so logit interpolation is the identity (A-18)"}
      se_reduction: {value: 8, provenance: HISTORICAL, reason: "earlier Student SE block"}
      lstm_layers: {value: 4, provenance: PAPER, reason: "same depth as the Teacher"}
      lstm_hidden_per_direction: {value: 64, provenance: RECONSTRUCTED_WITH_EVIDENCE, reason: "half the Teacher width (preset paper_student_d64 keeps 32)"}
      heads: {value: 1, provenance: PAPER, reason: "one attention head"}
  training:
    optimizer: {value: AdamW, provenance: HISTORICAL, reason: "earlier code of this project"}
    lr: {value: 5.0e-4, provenance: HISTORICAL, reason: "earlier code of this project"}
    weight_decay: {value: 1.0e-4, provenance: HISTORICAL, reason: "earlier code of this project"}
    scheduler: {value: "ReduceLROnPlateau(factor 0.5, patience 3, min 1e-6) on validation loss", provenance: HISTORICAL, reason: "earlier code of this project"}
    batch_size: {value: 32, provenance: ASSUMPTION, reason: "initial recipe"}
    epochs: {value: 200, provenance: ASSUMPTION, reason: "cap; early stopping ends the initial-recipe runs before it"}
    early_stopping: {value: "patience 10, min improvement 0.001, on validation loss", provenance: PAPER, reason: "initial recipe; the base configuration trains 120 epochs without early stopping"}
    checkpoint_selection: {value: "lowest validation CER", provenance: ASSUMPTION, reason: "validation only"}
    gradient_clip: {value: 1.0, provenance: HISTORICAL, reason: "earlier code of this project"}
    augmentation: {value: on, provenance: PAPER, reason: "train split only"}
    aux_weight_delta: {value: 0.1, provenance: PAPER, reason: "constant weight of the auxiliary CTC loss"}
    seeds: {value: [1, 2, 3], provenance: ASSUMPTION, reason: "three seeds per IAM development arm"}
    precision: {value: fp32, provenance: ASSUMPTION, reason: "--amp bf16 available"}
  distillation:
    teacher: {value: "frozen paper_teacher checkpoint of the same corpus and seed", provenance: PAPER, reason: "--teacher-ckpt (A-23)"}
    loss: {value: "alpha L_ctc + gamma tau^2 KL(P_T || P_S) + delta L_aux", provenance: PAPER, reason: "A-20"}
    alpha: {value: [0.7, 0.4], provenance: PAPER, reason: "linear in the epoch fraction"}
    gamma: {value: [0.2, 0.5], provenance: PAPER, reason: "linear in the epoch fraction"}
    delta: {value: 0.1, provenance: PAPER, reason: "constant"}
    tau: {value: 2.0, provenance: ASSUMPTION_SELECTED_ON_VALIDATION, reason: "D-004; the initial-recipe runs of queues A / A2 used tau 4, the default at that time"}
    logit_alignment: {value: "linear interpolation along time to the teacher's T", provenance: PAPER, reason: "identity for these presets"}
    kd_frames: {value: all, provenance: ASSUMPTION, reason: "the fixed canvas has no per-line width, so padding columns are distilled like content"}

post_processing:   # the T5 corrector and its gate (htrjand/t5post.py); reported beside the raw results
  corrector: {value: "t5-small fine-tuned on out-of-fold recognitions of the training split + error-profile corruptions (+ Wikipedia lines for t5_ext_ctx1)", provenance: PAPER, reason: "no validation or test label in training (A-30)"}
  gate: {value: "detect (all / out-of-lexicon / error estimate / both) x apply (line / segment) x theta, chosen on validation", provenance: RECONSTRUCTED_WITH_ASSUMPTION, reason: "A-31"}
  reporting: {value: "raw and post-processed CER side by side; the test split is decoded once and corrected once", provenance: ASSUMPTION, reason: "integrity rule of this release"}
